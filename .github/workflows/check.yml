name: Live check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in /api/config /sample-test/ /assets/products.json; do echo "::notice title=$u::$(curl -sSL -m 30 https://glutanex.co.in$u | tr -d '\n' | head -c 900)"; done
          echo "::notice title=cod-order GET status::$(curl -sSL -m 30 -o /dev/null -w '%{http_code} %{url_effective}' https://glutanex.co.in/api/cod-order)"
