name: Live check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in /api/delhivery-check /api/config; do echo "== $u"; curl -sS -m 30 "https://glutanex.co.in$u"; echo; done
          echo "== /api/cod-order (GET, should not be 404)"; curl -sS -m 30 -o /dev/null -w "%{http_code}\n" https://glutanex.co.in/api/cod-order
