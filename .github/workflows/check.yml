name: Live check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://www.theglowclub.in/ https://theglowclub.in/ https://www.glutanex.co.in/; do echo "::notice title=$u::$(curl -sS -m 30 -o /dev/null -w '%{http_code} -> %{url_effective} ip=%{remote_ip}' -L $u 2>&1 | head -c 300)"; done
          echo "::notice title=dns::$(dig +short www.theglowclub.in theglowclub.in | tr '\n' ' ')"
